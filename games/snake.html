<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9bbc0f;touch-action:none;
    font-family:"Courier New",monospace;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #hud{display:flex;justify-content:space-between;width:var(--w,300px);color:#0f380f;font-weight:bold;
    font-size:clamp(14px,3.4vmin,22px);padding:0 0 6px;box-sizing:border-box}
  canvas{display:block}
</style>
</head>
<body>
<div id="hud"><span id="sc">Score 0</span><span id="ln">Length 3</span><span id="bs">Best 0</span></div>
<canvas id="c"></canvas>
<script>
"use strict";
// ---------- config & helpers ----------
const N = 20, S = 600, C = S / N;               // grid cells, logical canvas size, cell size
const Q = new URLSearchParams(location.search); // ?auto = bot plays, ?len=40 = start long (for demos)
const AUTO = Q.has("auto"), START_LEN = +Q.get("len") || 3;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $sc = document.getElementById("sc"), $ln = document.getElementById("ln"), $bs = document.getElementById("bs");
const hud = document.getElementById("hud");
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return 255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))); };
  return [f(0), f(8), f(4)];
}
const BG0 = [155, 188, 15], FG0 = [15, 56, 15];  // classic Nokia LCD palette

// ---------- state ----------
let snake, dir, queue, food, score, acc, trauma, flash, freeze, headPop, deathT, state;
let parts = [], waves = [], texts = [], stars = [];
let time = 0, jv = 0, lastBeat = 0, best = +localStorage.getItem("snakeBest") || 0;
for (let i = 0; i < 70; i++) stars.push({ a: Math.random() * 6.283, r: Math.random() * 500 });

function reset() {
  // head at (10,10), body trails left, then down the left wall, then along the bottom (for ?len demos)
  const path = [];
  for (let x = 10; x >= 0; x--) path.push({ x, y: 10 });
  for (let y = 11; y < N; y++) path.push({ x: 0, y });
  for (let x = 1; x < N; x++) path.push({ x, y: N - 1 });
  snake = path.slice(0, Math.min(START_LEN, path.length));
  dir = { x: 1, y: 0 }; queue = []; score = 0; acc = 0; trauma = 0; flash = 0; freeze = 0;
  headPop = 0; deathT = 0; jv = 0; parts = []; waves = []; texts = [];
  placeFood(); state = "ready";
}
function placeFood() {
  const free = [];
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
    if (!snake.some(s => s.x === x && s.y === y) &&
        (snake.length >= 20 || (x > 0 && y > 0 && x < N - 1 && y < N - 1))) free.push({ x, y });
  food = free.length ? free[Math.random() * free.length | 0] : { x: -9, y: -9 };
  food.t = time;
}
// juice level 0..1 from snake length: 0 at length 3, 1 at length 43
const J = () => clamp((snake.length - 3) / 40, 0, 1);

// ---------- audio ----------
let ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, d, type = "square", vol = 0.07, f2 = 0) {
  if (muted || !ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
const PENTA = [0, 2, 4, 7, 9];

// ---------- game logic ----------
function autopilot() {
  const h = snake[0], opts = [dir, { x: dir.y, y: -dir.x }, { x: -dir.y, y: dir.x }];
  let bestD = null, bestS = 1e9;
  for (const d of opts) {
    const nx = h.x + d.x, ny = h.y + d.y;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || snake.slice(0, -1).some(s => s.x === nx && s.y === ny)) continue;
    const sc = Math.abs(nx - food.x) + Math.abs(ny - food.y) + (d === dir ? -0.1 : 0);
    if (sc < bestS) { bestS = sc; bestD = d; }
  }
  if (bestD) queue = [bestD];
}
function step() {
  if (AUTO) autopilot();
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const eating = h.x === food.x && h.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) return die();
  snake.unshift(h);
  if (!eating) snake.pop(); else eat();
}
const WORDS = ["NICE!", "COOL!", "SWEET!", "GREAT!", "WOW!", "AMAZING!", "INSANE!!", "UNREAL!!", "GODLIKE!!!", "LEGEND!!!"];
function burst(x, y, n, hue, spd) {
  for (let i = 0; i < n && parts.length < 1800; i++) {
    const a = Math.random() * 6.283, v = spd * (0.25 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.4 + Math.random() * 0.7,
      size: 2 + Math.random() * 4, hue: hue + Math.random() * 70 - 35 });
  }
}
function eat() {
  const len = snake.length, j = J(), fx = food.x * C + C / 2, fy = food.y * C + C / 2;
  score += 10; headPop = 1;
  const f = 330 * Math.pow(2, (PENTA[len % 5] + 12 * ((len / 5 | 0) % 3)) / 12);
  tone(f, 0.09);                                           // plain blip at every level
  if (j > 0.3) tone(f * 2, 0.14, "triangle", 0.06);
  if (j > 0.6) tone(120, 0.25, "sine", 0.25, 35);
  const hue = (time * 120) % 360;
  if (j > 0.12) burst(fx, fy, 8 + j * 70 | 0, hue, 120 + 300 * j);
  if (j > 0.2) { trauma = Math.min(1, trauma + 0.15 + j * 0.5);
    texts.push({ x: fx, y: fy, t: 0, s: "+10", size: 18 + j * 22, big: false }); }
  if (j > 0.25 && len % 3 === 0)
    texts.push({ x: S / 2, y: S / 2, t: 0, s: WORDS[Math.min(WORDS.length - 1, j * WORDS.length | 0)], size: 40 + j * 50, big: true });
  if (j > 0.45) waves.push({ x: fx, y: fy, t: 0, hue });
  if (j > 0.6) flash = Math.min(0.5, 0.15 + j * 0.3);
  if (j > 0.5) freeze = 0.03 + j * 0.04;                   // hit-stop
  placeFood();
}
function die() {
  const j = J(); state = "dead"; deathT = 0;
  tone(220, 0.7, "sawtooth", 0.1, 40);
  if (score > best) { best = score; localStorage.setItem("snakeBest", best); }
  if (j > 0.1) snake.forEach((s, i) => burst(s.x * C + C / 2, s.y * C + C / 2, 4 + j * 14 | 0, (i * 12 + time * 90) % 360, 150 + 400 * j));
  if (j > 0.2) { trauma = 1; flash = 0.5; waves.push({ x: snake[0].x * C + C / 2, y: snake[0].y * C + C / 2, t: 0, hue: 0 }); }
}

function update(dt) {
  time += dt; deathT += dt;
  if (state === "ready") food.t = time;           // so the food pops in when play begins
  jv = lerp(jv, J(), 1 - Math.exp(-dt * 4));
  if (freeze > 0) freeze -= dt;
  else if (state === "playing") {
    acc += dt;
    // starts 10% slower than before (0.149s), converges to the old speed by length 43
    const iv = Math.max(0.06, 0.149 - (snake.length - 3) * 0.001838);
    while (acc >= iv && state === "playing") { acc -= iv; step(); }
  }
  // beat: kicks in at high juice
  const b = Math.floor(time * 2.4);
  if (b !== lastBeat) { lastBeat = b;
    if (jv > 0.45 && state === "playing") waves.push({ x: S / 2, y: S / 2, t: 0, hue: (time * 90) % 360 });
    if (jv > 0.8 && state === "playing") { tone(110, 0.2, "sine", 0.18, 40); trauma = Math.min(1, trauma + 0.25); flash = Math.max(flash, 0.12); }
  }
  if (jv > 0.85 && state === "playing") trauma = Math.max(trauma, 0.12);
  trauma = Math.max(0, trauma - dt * 1.5); flash = Math.max(0, flash - dt * 2.2); headPop = Math.max(0, headPop - dt * 5);
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; }
  parts = parts.filter(p => p.life < p.max);
  for (const w of waves) w.t += dt * 1.6; waves = waves.filter(w => w.t < 1);
  for (const t of texts) t.t += dt * (t.big ? 1.2 : 1.5); texts = texts.filter(t => t.t < 1);
  for (const s of stars) { s.r += dt * (60 + 700 * jv) * (0.3 + s.r / 300); if (s.r > 520) { s.r = 5; s.a = Math.random() * 6.283; } }
}

// ---------- rendering ----------
let dpr = 1;
function resize() {
  const w = Math.max(160, Math.floor(Math.min(innerWidth - 12, innerHeight - 56, 780)));
  dpr = window.devicePixelRatio || 1;
  cv.style.width = cv.style.height = w + "px";
  cv.width = cv.height = Math.floor(w * dpr);
  document.documentElement.style.setProperty("--w", w + "px");
}
addEventListener("resize", resize);

function segColor(i) {
  const t = smooth(0.2, 0.45, jv), rb = smooth(0.8, 1, jv);
  const hue = 130 + time * 40 * jv + i * (3 + rb * 10);
  return rgb(mix(FG0, hsl2rgb(hue, 1, 0.55), t));
}
function drawSnake(ox, oy, override, glow, pulse) {
  const r = C * 0.3 * smooth(0.05, 0.3, jv), pad = 1 + 1.5 * smooth(0, 0.3, jv), k = cv.width / S;
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    let sc = 1 + (jv > 0.3 ? 0.12 * Math.sin(time * 10 - i * 0.6) * jv : 0);
    if (i === 0) sc += headPop * 0.4;
    const sz = (C - pad * 2) * sc, cx = s.x * C + C / 2 + ox, cy = s.y * C + C / 2 + oy;
    const col = override || segColor(i);
    ctx.fillStyle = col;
    if (glow) { ctx.shadowColor = col; ctx.shadowBlur = (8 + 18 * pulse) * jv * k; }
    ctx.beginPath(); ctx.roundRect(cx - sz / 2, cy - sz / 2, sz, sz, r); ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (jv > 0.1 && !override) {                                // eyes
    const h = snake[0], cx = h.x * C + C / 2, cy = h.y * C + C / 2, px = -dir.y * 5, py = dir.x * 5;
    ctx.fillStyle = "#fff";
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + dir.x * 4 + px * sg, cy + dir.y * 4 + py * sg, 2.6, 0, 6.283); ctx.fill(); }
  }
}
function drawFood(pulse) {
  if (food.x < 0 || state === "ready") return;   // hidden until the game starts
  const k = cv.width / S, fp = Math.min(1, (time - food.t) * 6);
  const wob = jv > 0.05 ? 1 + 0.15 * Math.sin(time * 8) * Math.min(1, jv * 4) : 1;
  const sz = (C - 6) * wob * (1 - Math.pow(1 - fp, 3) * 0.9), cx = food.x * C + C / 2, cy = food.y * C + C / 2;
  const t = smooth(0.2, 0.45, jv);
  const col = rgb(mix(FG0, hsl2rgb(time * 200, 1, 0.6), t));
  ctx.fillStyle = col;
  if (jv > 0.3) { ctx.shadowColor = col; ctx.shadowBlur = (12 + 25 * pulse) * jv * k; }
  ctx.beginPath(); ctx.roundRect(cx - sz / 2, cy - sz / 2, sz, sz, sz * 0.5 * smooth(0.05, 0.3, jv)); ctx.fill();
  ctx.shadowBlur = 0;
}
function draw() {
  const k = cv.width / S, j = jv, beat = (time * 2.4) % 1, pulse = Math.pow(1 - beat, 3) * smooth(0.4, 0.55, j);
  // background (translucent = motion trails at high juice)
  const rb = smooth(0.8, 0.95, j);
  let bg = mix(BG0, [12, 6, 22], smooth(0.15, 0.45, j));
  bg = mix(bg, [bg[0] + pulse * 35, bg[1], bg[2] + pulse * 50], 1);
  if (rb > 0) bg = mix(bg, hsl2rgb(time * 50, 1, 0.07 + 0.12 * pulse), rb);
  document.body.style.background = rgb(bg);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = j > 0.45 ? lerp(1, 0.3, smooth(0.45, 0.7, j)) : 1;
  ctx.fillStyle = rgb(bg); ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
  // camera: shake / rotation / zoom
  const sh = trauma * trauma;
  const mx = (Math.random() * 2 - 1) * sh * 30, my = (Math.random() * 2 - 1) * sh * 30;
  const rot = (Math.random() * 2 - 1) * sh * 0.07 + Math.sin(time * 1.7) * 0.025 * rb;
  const zoom = 1 + 0.04 * pulse * smooth(0.6, 0.9, j) + sh * 0.06;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.translate(S / 2 + mx, S / 2 + my); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-S / 2, -S / 2);
  // stars streaking from the center
  const sa = smooth(0.6, 0.9, j);
  if (sa > 0) {
    ctx.lineWidth = 2; ctx.lineCap = "round";
    for (const s of stars) {
      const c = Math.cos(s.a), n = Math.sin(s.a), l = 4 + s.r * 0.12 * sa;
      ctx.strokeStyle = `hsla(${(s.a * 57 + time * 80) % 360},100%,70%,${0.5 * sa * Math.min(1, s.r / 100)})`;
      ctx.beginPath(); ctx.moveTo(S / 2 + c * s.r, S / 2 + n * s.r); ctx.lineTo(S / 2 + c * (s.r + l), S / 2 + n * (s.r + l)); ctx.stroke();
    }
  }
  // grid + border
  const fgc = mix(FG0, [255, 255, 255], smooth(0.2, 0.45, j));
  if (j > 0.1) {
    ctx.strokeStyle = `rgba(${fgc[0] | 0},${fgc[1] | 0},${fgc[2] | 0},${0.04 + 0.08 * j + 0.1 * pulse})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < N; i++) { ctx.moveTo(i * C, 0); ctx.lineTo(i * C, S); ctx.moveTo(0, i * C); ctx.lineTo(S, i * C); }
    ctx.stroke();
  }
  ctx.lineWidth = 3 + 3 * j; ctx.strokeStyle = j > 0.3 ? `hsl(${time * 100},100%,${55 + 20 * pulse}%)` : rgb(FG0);
  if (j > 0.3) { ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 20 * j * k; }
  ctx.strokeRect(1.5, 1.5, S - 3, S - 3); ctx.shadowBlur = 0;
  // shockwaves
  for (const w of waves) {
    ctx.strokeStyle = `hsla(${w.hue},100%,65%,${1 - w.t})`; ctx.lineWidth = 6 * (1 - w.t);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.t * 420, 0, 6.283); ctx.stroke();
  }
  drawFood(pulse);
  // chromatic aberration ghosts
  const ca = smooth(0.6, 1, j);
  if (ca > 0 && state !== "dead") {
    const a = 2 + 6 * ca * (1 + trauma * 2);
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55;
    drawSnake(-a, 0, "rgb(255,0,60)"); drawSnake(a, 0, "rgb(0,200,255)");
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
  if (state !== "dead" || deathT < 0.15 || j < 0.1) drawSnake(0, 0, null, j > 0.3, pulse);
  // particles
  if (parts.length) {
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      const a = 1 - p.life / p.max;
      ctx.fillStyle = `hsla(${p.hue},100%,60%,${a})`;
      const z = p.size * (0.4 + a); ctx.fillRect(p.x - z / 2, p.y - z / 2, z, z);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  // floating text
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (const t of texts) {
    const pop = t.big ? 1 + 0.5 * Math.pow(1 - Math.min(1, t.t * 5), 2) : 1;
    ctx.globalAlpha = 1 - t.t * t.t; ctx.font = `bold ${t.size * pop}px "Courier New",monospace`;
    const y = t.y - t.t * (t.big ? 40 : 50), hue = (time * 200 + t.t * 100) % 360;
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(t.s, t.x, y);
    ctx.fillStyle = t.big ? `hsl(${hue},100%,65%)` : "#fff"; ctx.fillText(t.s, t.x, y);
  }
  ctx.globalAlpha = 1;
  // screen-space: flash + messages
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const strobe = rb * pulse * 0.1;
  if (flash + strobe > 0.005) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, flash + strobe)})`; ctx.fillRect(0, 0, S, S); }
  ctx.fillStyle = j > 0.3 ? "#fff" : rgb(FG0); ctx.textAlign = "center";
  if (state === "ready") {
    ctx.font = 'bold 56px "Courier New",monospace'; ctx.fillText("SNAKE", S / 2, S / 2 - 70);
    ctx.font = 'bold 22px "Courier New",monospace'; ctx.fillText("Arrows / WASD / swipe to start", S / 2, S / 2 - 25);
  } else if (state === "dead") {
    ctx.font = 'bold 56px "Courier New",monospace'; ctx.fillText("GAME OVER", S / 2, S / 2 - 70);
    ctx.font = 'bold 22px "Courier New",monospace';
    ctx.fillText(`Length ${snake.length}  -  Score ${score}`, S / 2, S / 2 - 25);
    if (deathT > 0.6) ctx.fillText("Press space or tap to retry", S / 2, S / 2 + 10);
  }
  // HUD (DOM) goes neon too
  const hc = mix(FG0, [255, 255, 255], smooth(0.2, 0.45, j));
  hud.style.color = rgb(hc);
  hud.style.textShadow = j > 0.3 ? `0 0 ${4 + 10 * j}px hsl(${time * 100},100%,60%)` : "none";
  $sc.textContent = "Score " + score; $ln.textContent = "Length " + snake.length; $bs.textContent = "Best " + best;
}

// ---------- input ----------
function input(x, y) {
  audio();
  if (state === "dead") { if (deathT > 0.6) reset(); return; }
  if (state === "ready") state = "playing";
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((last.x === -x && last.y === -y) || (last.x === x && last.y === y)) return;
  if (queue.length < 3) queue.push({ x, y });
}
const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "m") { muted = !muted; return; }
  if (KEYS[k]) { e.preventDefault(); input(...KEYS[k]); }
  else if (k === " " || k === "Enter") {
    e.preventDefault(); audio();
    if (state === "dead" && deathT > 0.6) reset(); else if (state === "ready") state = "playing";
  }
});
let tx = 0, ty = 0, moved = false;
cv.addEventListener("touchstart", e => { e.preventDefault(); audio(); tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false; }, { passive: false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.hypot(dx, dy) < 20) return;
  moved = true; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  Math.abs(dx) > Math.abs(dy) ? input(Math.sign(dx), 0) : input(0, Math.sign(dy));
}, { passive: false });
cv.addEventListener("touchend", e => {
  e.preventDefault();
  if (!moved) { if (state === "dead" && deathT > 0.6) reset(); else if (state === "ready") state = "playing"; }
}, { passive: false });
cv.addEventListener("mousedown", () => { audio(); if (state === "dead" && deathT > 0.6) reset(); else if (state === "ready") state = "playing"; });

// ---------- main loop ----------
reset(); resize();
if (AUTO) state = "playing";
if (Q.has("selftest")) {   // ?selftest&auto : simulate 2 minutes headless, report in document.title
  let maxLen = 0, deaths = 0, res;
  try {
    for (let i = 0; i < 7200; i++) {
      update(1 / 60); draw(); maxLen = Math.max(maxLen, snake.length);
      if (state === "dead" && deathT > 1.5) { deaths++; reset(); state = "playing"; }
    }
    res = "RESULT: PASS maxLen=" + maxLen + " deaths=" + deaths + " parts=" + parts.length;
  } catch (e) { res = "RESULT: FAIL " + e.message; }
  document.title = res;
}
let prev = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - prev) / 1000); prev = t;
  update(dt);
  if (AUTO && state === "dead" && deathT > 1.5) { reset(); state = "playing"; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
